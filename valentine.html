<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
    }

    h1 {
      color: #c9184a;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      width: 320px;
      height: 170px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.2s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      left: 20px;
      top: 60px;
      transform: scale(1);
    }

    #no {
      background-color: #adb5bd;
      color: #333;
      left: 190px;
      top: 60px;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    video {
      width: 320px;
      margin-top: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .big-heart {
      font-size: 80px;
      animation: pulse 1s infinite;
      margin: 10px 0;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <h1>Chitranshi, will you be my Valentine? 💕</h1>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no">No 😢</button>
  </div>

  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    let yesScale = 1;

    noButton.addEventListener("mouseover", () => {
      noButton.style.left = Math.random() * 260 + "px";
      noButton.style.top = Math.random() * 130 + "px";

      yesScale += 0.15;
      yesButton.style.transform = `scale(${yesScale})`;
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }

    function startHearts() {
      setInterval(createHeart, 300);
    }

    function fireConfetti() {
      confetti({
        particleCount: 250,
        spread: 100,
        origin: { y: 0.6 }
      });

      setInterval(() => {
        confetti({
          particleCount: 40,
          spread: 60,
          origin: { x: Math.random(), y: 0 }
        });
      }, 800);
    }

    function yesClicked() {
      document.body.innerHTML = `
        <h1 style="color:#ff1e56;">YAAYYY!!!!<br>I LOVE YOU MY SUPEREVERYTHING</h1>
        <div class="big-heart">❤️</div>
        <video autoplay loop controls>
          <source src="valentine-video.mp4" type="video/mp4">
        </video>
      `;
      startHearts();
      fireConfetti();
    }
  </script>

</body>
</html>
